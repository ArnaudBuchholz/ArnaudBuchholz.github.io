### 💡 Overview

**Running** TypeScript sources in Node **without transpilation** during **development**

Benefits :

* **Faster** code to test
* **Simplified** debugging
* Dev to Prod **parity**

---

#### Context

[`ui5-test-runner`](https://github.com/ArnaudBuchholz/ui5-test-runner) was **initially** developped in JavaScript only

Version 6 _required_ a **complete rewrite** in TypeScript because of :

* Maintainability
* Troubleshooting
* Performance
* ...

---

#### Classic TypeScript Development Loop

- `tsc --watch` → a `dist/` that can go **stale**, a second process to **babysit**
- `ts-node` / `bundler-in-dev` → **slower** startup, **source-map juggling** to debug
- Edit ➰ wait for rebuild ➰ run ➰ repeat

<small>⚠️ TypeScript 7 is not used because the **ecosystem** dit **not adopt** it</small>

---

#### Expectations

**Edit** a `.ts` file, **run** the codebase, **done**

Split in the project :
- **Development** : `npm run cli`
- **Published package** : `tsc` emits `dist/`

Same sources, two paths<br>
The build step exists only for the **shipped** artifact

---

### Node Type **Stripping**

[`--experimental-strip-types`](https://nodejs.org/learn/typescript/run-natively)
<small>stable-ish on Node 24, `.nvmrc` pins `v24.18.0`, `engines` requires `>=24.11.1`</small>

What Node does:

* **Parse** the TypeScript
* **Erase** the type annotations *in place*
* **Run** the resulting JavaScript

---

#### Stripping

**strip** does not mean **transform** :

```ts
function greet(name: string): string {   // as written
function greet(name        )         {   // what Node.js runs
```

- Annotations are **blanked out**
- **No** source maps needed
- Stack traces point at the **real `.ts`** line

The type annotations **never** reaches runtime

---

#### ⚠️ Limits

* Only **erasable** syntax

* Does **not** work with `imports`<br><small>When writing TypeScript source code, `imports` **must explicitly** point to `.js` files</small>

---

### `erasableSyntaxOnly`

A [TypeScript setting](https://www.typescriptlang.org/tsconfig/#erasableSyntaxOnly) defined in `tsconfig.base.json`:

```jsonc
{
  "erasableSyntaxOnly": true
}
```

Type stripping only works if **every** TS construct can be **removed** by erasing text

---

#### ⚠️ Non Strippable

Some features **emit runtime code**<br>and **cannot** simply be stripped:

- `enum` : generates an object
- `namespace` with a body : generates an IIFE
- parameter properties : generate assignments<br><small>`constructor(private x)`</small>
- decorators...

`erasableSyntaxOnly` makes the compiler **reject** all of these.

---

### Node Module **Hooks**

How to handle `import` pointing<br>to a **non existing** `.js` file ?

<br>

The [`node:module`](https://nodejs.org/api/module.html) module provides **utilities** for interacting with the Node.js **module system**.

---

#### `src/platform/js2ts.mjs`

[`js2ts.mjs`](https://github.com/ArnaudBuchholz/ui5-test-runner/blob/main/src/platform/js2ts.mjs) is loaded via `--import` **before** anything else runs

It calls [`registerHooks`](https://nodejs.org/api/module.html#moduleregisterhooksoptions) from `node:module` with **two hooks**

---

#### `resolve`

rewrites `./foo.js` import specifiers to `./foo.ts` when a sibling `.ts` exists:

Why? The source always imports with `.js` specifiers — that's what the *compiled* `dist/` needs. The hook lets dev mode map those back to `.ts` on the fly. **One import style, both worlds.**

---

#### `load`

reads the `.ts` and strips its types before handing it to V8:

```js
const jsSource = stripTypeScriptTypes(source, { mode: 'strip' });
return { format: 'module', source: jsSource, shortCircuit: true };
```

This is the piece Node's flag alone doesn't give you — the `.js → .ts` resolution.

---

### How The Pieces **Fit** Together

```text
node  --experimental-strip-types
      --import js2ts.mjs src/cli.ts
          │                  │
          │                  └── entry point (real .ts)
          │
          ├── resolve hook: "./x.js"  →  "./x.ts"
          └── load hook:    read .ts  →  stripTypeScriptTypes()
                                             │
                                             └── V8 runs it

tsconfig guardrail only: type-checks + forbids non-erasable syntax
```

The compiler is the **safety net**; the hook + flag are the **runtime**. They never touch each other at dev time.

---

### Trade-offs

- **Experimental flag** → paired with `--no-warnings` to keep output clean.
- **No type checking at runtime.** Stripping ignores type errors entirely. Types are enforced separately by `npm run lint` → `tsc --build --noEmit`. The dev loop *trusts* the editor + CI for correctness; the runtime only needs valid JavaScript.
- **The published package still uses real `tsc`** (`tsconfig.cli.json` → `dist/`). This technique is for the *dev loop*, not the shipped artifact.
- **Node ≥ 24 only.** Not an option on older runtimes.
- **Discipline tax:** you give up `enum`, runtime `namespace`, parameter properties. In practice: easy, and arguably better style.

---

### Takeaways

**What you need:**
- Node ≥ 24
- `erasableSyntaxOnly: true` in tsconfig
- A ~40-line module hook (`resolve` + `load`)

**What you get:**
- Instant edit → run, no rebuild
- No build artifacts cluttering the dev loop
- A single source of truth — the `.ts` file *is* the program

> Types are a *compile-time* and *editor* concern. At runtime, well-written TypeScript is just JavaScript wearing annotations — so let Node take the annotations off and run it.
